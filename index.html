<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leave Your Mark In The Fog - Insert Your Name</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500;1,600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css" />
</head>

<body>
  <!-- Background Texture & Fog Atmosphere -->
  <div class="fog-background">
    <div class="mesh-overlay"></div>
    <div class="fog-clouds"></div>
    <div class="glow-orb orb-top-left"></div>
    <canvas id="smokeCanvas" class="smoke-canvas"></canvas>
  </div>

  <!-- Center Hero UI (Input Phase) -->
  <main class="center-container" id="inputSection">
    <header class="title-group">
      <p class="subtitle">Cari apa Yang Ada di Dalam Dirimu</p>
      <h1 class="main-title">INSERT YOUR NAME</h1>
    </header>

    <div class="input-group">
      <input type="text" id="nameInput" class="name-input" placeholder="Your name..." autocomplete="off"
        spellcheck="false" />
      <button type="button" id="enterBtn" class="enter-btn">ENTER</button>
    </div>
  </main>

  <!-- 3D Kodam Reveal Stage (Activated on Submit) -->
  <section class="kodam-container hidden" id="kodamContainer">
    <!-- Big Title BEHIND the 3D model (z-index below 3D model) -->
    <div class="kodam-backdrop-title">
      <h2 class="kodam-title-big" id="kodamTitleBig">DR. DOOM</h2>
    </div>

    <!-- 3D Model Canvas (z-index in front of big title) -->
    <div class="three-canvas-wrapper" id="threeWrapper">
      <canvas id="threeCanvas"></canvas>
    </div>

    <!-- Foreground UI: Top subtitle and Bottom Button -->
    <div class="kodam-foreground-ui">
      <p class="kodam-subtitle" id="userNameLabel">KODAM ANDA</p>
      <button type="button" class="back-btn" id="backBtn">CEK LAGI</button>
    </div>
  </section>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
